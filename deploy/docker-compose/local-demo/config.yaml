deployment:
  mode: "single_tenant"

server:
  listen: "0.0.0.0:8080"
  public_base_url: "http://127.0.0.1:8080"
  tls:
    enabled: false
    cert_file_ref: null
    key_file_ref: null

tenants:
  - tenant_id: "tenant-a"
    connector_id: "wwcon_8K4M2Q9F7D3H6P1X"
    authrim:
      hmac_keys:
        active:
          kid: "kid-active"
          secret_ref: "env:AUTHRIM_WORDWARDEN_SECRET_ACTIVE"
      audit_hash_secret_ref: "env:AUTHRIM_WORDWARDEN_AUDIT_HASH_SECRET"
    ldap:
      url: "ldaps://openldap:636"
      tls:
        verify: true
        server_name: "localhost"
        ca_file_ref: "file:/etc/authrim-wordwarden/ca/ca.crt"
      lookup_mode: "search_then_bind"
      username:
        allowed_formats:
          - local_part
          - email
        allowed_domains:
          - example.com
        normalization:
          trim: true
          unicode: "NFKC"
          case: "lower"
          reject_domain_mismatch: true
      bind_dn: "cn=admin,dc=example,dc=com"
      bind_password_ref: "env:LDAP_BIND_PASSWORD"
      base_dn: "dc=example,dc=com"
      user_filter: "(uid={username})"
      filter_template_mode: "builtin_or_template"
      attributes:
        - uid
        - mail
        - displayName
    timeouts:
      ldap_connect_ms: 1000
      ldap_bind_ms: 1500
      ldap_search_ms: 1500
      request_ms: 3000
    protection:
      max_concurrent_requests: 8
      storm_window_ms: 10000
      storm_block_ms: 30000
      malformed_request_limit: 20
      replay_limit: 10
      directory_error_limit: 5
