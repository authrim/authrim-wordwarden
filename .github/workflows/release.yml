name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  artifacts:
    name: Build signed release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Test
        run: go test ./...

      - name: Validate example config
        run: go run ./cmd/wordwarden --config config.example.yaml config validate

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Build signed artifacts
        run: ./scripts/build-release.sh
        env:
          VERSION: ${{ github.ref_name }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*.tar.gz
            dist/release/SHA256SUMS
            dist/release/SHA256SUMS.sig
            dist/release/SHA256SUMS.bundle
            dist/release/*_sbom.json

  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: artifacts
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Test
        run: go test ./...

      - name: Validate example config
        run: go run ./cmd/wordwarden --config config.example.yaml config validate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/authrim/authrim-wordwarden
          tags: |
            type=ref,event=tag

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
